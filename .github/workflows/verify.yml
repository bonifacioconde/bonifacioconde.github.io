name: Verify build

# GitHub Pages serves this site directly from the committed docs/ folder
# (Settings → Pages → Deploy from a branch → master → /docs), so there is no
# deploy step here. This workflow only guards the one weakness of that setup:
# forgetting to run `npm run build` before committing, which would leave the
# published site stale relative to src/.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild site
        run: npm run build

      - name: Fail if docs/ is out of date
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat docs/
            exit 1
          fi
          echo "docs/ matches src/."
